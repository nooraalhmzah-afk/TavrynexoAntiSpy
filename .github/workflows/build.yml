name: Build Tavrynexo AntiSpy EXE and Microsoft Store Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish Standalone Single-File EXE with Icon
      run: |
        dotnet publish TavrynexoAntiSpy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Package MSIX and APPX for Microsoft Store
      shell: pwsh
      run: |
         = "./appx_package"
        if (Test-Path ) { Remove-Item -Path  -Recurse -Force }
        New-Item -ItemType Directory -Force -Path 
        New-Item -ItemType Directory -Force -Path "/Assets"

        Copy-Item -Path "./publish/TavrynexoAntiSpy.exe" -Destination "/TavrynexoAntiSpy.exe"
        Copy-Item -Path "./AppxManifest.xml" -Destination "/AppxManifest.xml"
        Copy-Item -Path "./Assets/*" -Destination "/Assets" -Force

        # Locate makeappx.exe and makepri.exe from Windows SDK
         = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { clear.FullName -like "*x64*" } | Select-Object -First 1).DirectoryName
         = Join-Path  "makeappx.exe"
         = Join-Path  "makepri.exe"
        Write-Host "Using MakeAppx: "
        Write-Host "Using MakePri: "

        # Generate resources.pri required by Microsoft Store Partner Center
        if (Test-Path ) {
            &  createconfig /cf "/priconfig.xml" /dq en-US /pv 10.0.0 /o
            &  new /pr "" /cf "/priconfig.xml" /of "/resources.pri" /o
            Remove-Item -Path "/priconfig.xml" -Force -ErrorAction SilentlyContinue
        }

        New-Item -ItemType Directory -Force -Path "./store_packages"
        &  pack /d  /p ./store_packages/TavrynexoAntiSpy.msix /o
        &  pack /d  /p ./store_packages/TavrynexoAntiSpy.appx /o

    - name: Upload Standalone EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TavrynexoAntiSpy-Standalone-EXE
        path: ./publish/TavrynexoAntiSpy.exe

    - name: Upload Microsoft Store Packages (MSIX & APPX)
      uses: actions/upload-artifact@v4
      with:
        name: TavrynexoAntiSpy-Microsoft-Store-Packages
        path: ./store_packages/*
